<title>iQ The Best! Animated</title>
<meta name="description" content="A 30-second animated opening scene for the iQ The Best! comic, built in code with three.js and the Web Audio API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Lilita+One&family=Luckiest+Guy&display=swap">
<style>
/* Layout: one inked comic panel as the stage, a slim control strip beneath it, on a dark halftone page.
   Single deliberate dark look (a cinema/comic-shop page), so no light variant. */
:root{
  --page:#16131b;
  --ink:#141018;
  --paper:#f7eed6;
  --pink:#ff2a8f;
  --yellow:#ffe23d;
  --muted:#b3aac4;
  --dot:rgba(255,255,255,.05);
  --font-display:'Bangers','Impact','Arial Narrow Bold',sans-serif;
  --font-title:'Luckiest Guy','Bangers','Impact',sans-serif;
  --font-logo:'Lilita One','Arial Black',sans-serif;
  --font-letter:'Comic Neue','Comic Sans MS','Chalkboard SE','Trebuchet MS',sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{margin:0;background-color:var(--page);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:7px 7px;color:var(--paper);font-family:var(--font-letter)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 30px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
.logo{margin:0;font-family:var(--font-title);font-weight:400;font-size:clamp(28px,4.6vw,46px);line-height:1;letter-spacing:.02em;color:var(--pink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.logo span{color:var(--yellow);font-family:var(--font-title)}
.logo{font-family:var(--font-logo)}
.sub{margin:0;color:var(--muted);font-size:14px;letter-spacing:.08em;text-transform:uppercase}

.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--paper),9px 9px 0 3px var(--pink);overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.bubble{position:absolute;left:0;top:0;visibility:hidden;transform-origin:50% 100%;background:#fffdf6;color:var(--ink);border:.32cqw solid var(--ink);border-radius:50%;padding:1.7cqw 2.8cqw;font:700 2.35cqw/1.12 var(--font-letter);text-transform:uppercase;text-align:center;width:max-content;max-width:25cqw;box-shadow:.45cqw .45cqw 0 rgba(20,16,24,.35)}
.bubble .rest{visibility:hidden}
.caption{position:absolute;visibility:hidden;background:var(--yellow);color:var(--ink);border:.3cqw solid var(--ink);padding:.8cqw 1.3cqw .6cqw;font:400 2.2cqw/1 var(--font-display);letter-spacing:.07em;box-shadow:.5cqw .5cqw 0 var(--ink);white-space:nowrap}
.caption.tl{left:2.6cqw;top:2.6cqw}
.caption.br{right:2.6cqw;bottom:2.8cqw}
.sfx{position:absolute;left:0;top:0;visibility:hidden;font:400 7cqw/1 var(--font-display);color:var(--yellow);-webkit-text-stroke:.55cqw var(--ink);paint-order:stroke fill;text-shadow:.6cqw .6cqw 0 var(--pink);letter-spacing:.03em;white-space:nowrap}
.sfx.small{font-size:4.2cqw;-webkit-text-stroke:.4cqw var(--ink)}
.plate{position:absolute;left:2.6cqw;bottom:3.4cqw;visibility:hidden;background:var(--pink);color:#fff;border:.35cqw solid var(--ink);padding:.7cqw 1.8cqw .45cqw;font:400 3.8cqw/1 var(--font-display);letter-spacing:.09em;box-shadow:.55cqw .55cqw 0 var(--ink);transform-origin:0 50%}
.title-svg{visibility:hidden}
.title-svg text{font-family:var(--font-title);paint-order:stroke fill;stroke-linejoin:round}

.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-3deg);background:var(--yellow);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);font:400 clamp(22px,4.2cqw,46px)/1 var(--font-display);letter-spacing:.08em;padding:.45em 1.1em .35em;cursor:pointer}
.bigplay:hover{background:#fff27a}
.bigplay:focus-visible,.btn:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--pink);outline-offset:3px}

.bar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.btn{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--pink);font:400 18px/1 var(--font-display);letter-spacing:.08em;padding:9px 14px 7px;cursor:pointer;min-width:0}
.btn.primary{background:var(--yellow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pink)}
.scrub{flex:1 1 220px;min-width:0;display:flex}
.scrub input{width:100%;accent-color:var(--pink)}
.time{font:700 15px/1 var(--font-letter);color:var(--muted);font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.note{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:68ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

html.capture,html.capture body{margin:0;padding:0;background:#000;overflow:hidden}
html.capture .head,html.capture .bar,html.capture .note,html.capture .bigplay{display:none}
html.capture .wrap{padding:0;max-width:none;display:block}
html.capture .stage{position:fixed;inset:0;width:100vw;height:100vh;border:0;box-shadow:none;aspect-ratio:auto}
</style>

<main class="wrap">
  <header class="head">
    <h1 class="logo">iQ <span>The Best!</span></h1>
    <p class="sub">Opening scene · 0:30 · animation test</p>
  </header>

  <div class="stage" id="stage" aria-label="Animated scene: the iQ team arrive at the shop before opening">
    <canvas id="gl"></canvas>
    <div class="ov" id="ov"></div>
    <button class="bigplay" id="bigplay" type="button">▶ Play the scene</button>
  </div>

  <div class="bar">
    <button class="btn primary" id="btnPlay" type="button">Play</button>
    <button class="btn" id="btnRestart" type="button">Restart</button>
    <button class="btn" id="btnSound" type="button" aria-pressed="true">Sound: on</button>
    <label class="scrub" for="scrub"><span class="sr">Scene position</span><input id="scrub" type="range" min="0" max="30" step="0.01" value="28.9"></label>
    <output class="time" id="time" for="scrub">0:28 / 0:30</output>
  </div>
  <p class="note">Pause and drag the picture to look around the shop in 3D. Every character, prop and sound here is generated in code; the scene uses no image, video or audio files.</p>
</main>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* =====================================================================
   Setup and small helpers
   ===================================================================== */
const DURATION = 30, POSTER_T = 28.9;
const CAPTURE = !!window.__IQ_CAPTURE__;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ON_TWOS = true;               // characters animate at 15 fps, camera at full rate
const TYPE_CPS = 40;                // lettering speed in speech bubbles
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl'), ov = $('ov');
if (CAPTURE) document.documentElement.classList.add('capture');

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const k = win(x, a, b); return k * k * (3 - 2 * k); };
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* =====================================================================
   Renderer, render targets and the comic post-process
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1120);
const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 80);
const LM = 0, LI = 1, LF = 2;   // main geometry, ink hulls, effects (excluded from edge detection)

const rtColor = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType, samples: 4 });
const rtND = new THREE.WebGLRenderTarget(16, 16, { type: THREE.HalfFloatType });

// Normal + inverse-depth pass used to find ink lines.
const ndMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vN; varying float vZ;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vZ = -mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vN; varying float vZ;
    void main(){ vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n; gl_FragColor = vec4(n*0.5+0.5, 1.0/max(vZ,0.01)); }`,
  side: THREE.DoubleSide
});

// Inverted-hull outline for characters and props: thick, confident brush lines.
const inkMat = new THREE.ShaderMaterial({
  uniforms: { thick: { value: 0.0024 }, col: { value: new THREE.Color(0x120f16) } },
  vertexShader: `uniform float thick;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vec3 n = normalize(normalMatrix*normal);
      mv.xyz += n*thick*clamp(-mv.z,0.6,14.0); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 col; void main(){ gl_FragColor = vec4(col,1.0); }`,
  side: THREE.BackSide
});

const post = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: null }, tND: { value: null }, res: { value: new THREE.Vector2(1, 1) },
    lineW: { value: 1.2 }, cell: { value: 5 }, halftone: { value: 1 }, flash: { value: 0 },
    flashCol: { value: new THREE.Vector3(1, 1, .86) }, speed: { value: 0 }, speedC: { value: new THREE.Vector2(.5, .5) },
    tick: { value: 0 }, fade: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `precision highp float;
    uniform sampler2D tColor, tND; uniform vec2 res, speedC; uniform vec3 flashCol;
    uniform float lineW, cell, halftone, flash, speed, tick, fade;
    varying vec2 vUv;
    vec3 toSRGB(vec3 c){ c = max(c, vec3(0.0)); return mix(c*12.92, 1.055*pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c)); }

      vec4 c = texture2D(tND, uv);

      vec4 u = texture2D(tND, uv+vec2(0.0,o.y)), d = texture2D(tND, uv-vec2(0.0,o.y));
      vec4 lu = texture2D(tND, uv+vec2(-o.x,o.y)), rd = texture2D(tND, uv+vec2(o.x,-o.y));
      vec4 ru = texture2D(tND, uv+o), ld = texture2D(tND, uv-o);

      float lap = abs(l.a+r.a-2.0*w) + abs(u.a+d.a-2.0*w) + 0.5*(abs(lu.a+rd.a-2.0*w) + abs(ru.a+ld.a-2.0*w));
      float de = smoothstep(0.035, 0.1, lap/max(w, 1e-3));
      vec3 n = c.rgb*2.0-1.0;
      float nd = 0.0;
      nd = max(nd, 1.0-dot(n, l.rgb*2.0-1.0)); nd = max(nd, 1.0-dot(n, r.rgb*2.0-1.0));
      nd = max(nd, 1.0-dot(n, u.rgb*2.0-1.0)); nd = max(nd, 1.0-dot(n, d.rgb*2.0-1.0));
      float ne = smoothstep(0.3, 0.6, nd);
      return max(de, ne);
    }
    void main(){
      vec3 col = toSRGB(texture2D(tColor, vUv).rgb);
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = clamp(mix(vec3(lum), col, 1.16), 0.0, 1.0);
      vec2 fc = gl_FragCoord.xy;
      vec2 q = mat2(0.7071, -0.7071, 0.7071, 0.7071)*fc/cell;
      vec2 g = fract(q) - 0.5;
      float dark = smoothstep(0.6, 0.08, lum);
      float rad = 0.56*sqrt(dark);
      float aa = 0.8/cell;
      float dotm = 1.0 - smoothstep(rad-aa, rad+aa, length(g));
      col *= 1.0 - dotm*halftone*0.36*step(0.03, dark);
      float e = edgeAt(vUv);
      col = mix(col, vec3(0.075, 0.06, 0.09), e);
      if (speed > 0.001) {
        vec2 p = (vUv - speedC)*vec2(res.x/res.y, 1.0);
        float a = atan(p.y, p.x)/6.2831853 + 0.5;
        float rr = length(p);
        float k = a*150.0; float id = floor(k); float f = fract(k);
        float rnd = h21(vec2(id, tick));
        float wdt = 0.5*rnd*smoothstep(0.2, 1.0, rr);
        float line = step(0.6, rnd)*(1.0 - smoothstep(wdt*0.5, wdt*0.5+0.06, abs(f-0.5)));
        float m = smoothstep(0.3 + 0.25*h21(vec2(id, tick+3.0)), 0.95, rr);
        col = mix(col, vec3(0.075, 0.06, 0.09), line*m*speed);
      }
      col = mix(col, flashCol, flash);
      col += (h21(floor(fc*0.5)) - 0.5)*0.035;
      vec2 vv = vUv - 0.5; col *= 1.0 - 0.34*pow(dot(vv, vv)*2.0, 1.4);
      col *= 1.0 - fade;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
{
  const tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  tri.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
  const m = new THREE.Mesh(tri, post); m.frustumCulled = false; postScene.add(m);
}

let stageW = 1, stageH = 1;
function resize() {
  const r = stage.getBoundingClientRect();
  stageW = Math.max(1, r.width); stageH = Math.max(1, r.height);
  const dpr = CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(stageW * dpr), h = Math.round(stageH * dpr);
  const maxPx = CAPTURE ? 1920 * 1080 : 2400 * 1350;
  if (w * h > maxPx) { const s = Math.sqrt(maxPx / (w * h)); w = Math.round(w * s); h = Math.round(h * s); }
  w = Math.max(2, w); h = Math.max(2, h);
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  rtColor.setSize(w, h); rtND.setSize(w, h);
  post.uniforms.res.value.set(w, h);
  post.uniforms.cell.value = Math.max(3, h / 185);
  post.uniforms.lineW.value = Math.max(1, h / 820);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}

function renderFrame() {
  camera.layers.set(LM); camera.layers.enable(LI); camera.layers.enable(LF);
  renderer.setRenderTarget(rtColor); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(scene, camera);
  camera.layers.set(LM);
  const bg = scene.background; scene.background = null; scene.overrideMaterial = ndMat;
  renderer.setRenderTarget(rtND); renderer.setClearColor(0x8080ff, 0); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null; scene.background = bg;
  post.uniforms.tColor.value = rtColor.texture; post.uniforms.tND.value = rtND.texture;
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1); renderer.render(postScene, postCam);
}

/* =====================================================================
   Materials, geometry and textures
   ===================================================================== */
const grad = new THREE.DataTexture(new Uint8Array([92, 92, 92, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false; grad.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...o });
const basic = (color, o = {}) => new THREE.MeshBasicMaterial({ color, ...o });

const G = {
  sphere: new THREE.SphereGeometry(1, 28, 18),
  head: new THREE.SphereGeometry(1, 64, 40),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 28),
  box: new THREE.BoxGeometry(1, 1, 1),
  plane: new THREE.PlaneGeometry(1, 1),
  disc: new THREE.CircleGeometry(1, 32),
  drop: (() => {
    const pts = [];
    for (let i = 0; i <= 16; i++) { const s = i / 16; const r = Math.pow(Math.sin(Math.PI * s), 0.8) * (1 - 0.7 * s); pts.push(new THREE.Vector2(Math.max(r, 1e-4), -1 + 2 * s)); }
    return new THREE.LatheGeometry(pts, 14);
  })()
};
const _geo = {};
function limbGeo(r, len) { const k = 'l' + r.toFixed(4) + '|' + len.toFixed(4); if (!_geo[k]) { const g = new THREE.CapsuleGeometry(r, len, 6, 18); g.translate(0, -len / 2, 0); _geo[k] = g; } return _geo[k]; }
function capC(r, len) { const k = 'c' + r.toFixed(4) + '|' + len.toFixed(4); if (!_geo[k]) _geo[k] = new THREE.CapsuleGeometry(r, len, 6, 18); return _geo[k]; }
function torsoGeo(Lc) { const k = 't' + Lc.toFixed(3); if (!_geo[k]) _geo[k] = new THREE.CapsuleGeometry(1, Lc, 10, 28); return _geo[k]; }
function roundedBox(w, h, d, r, n = 10) {
  const k = ['rb', w, h, d, r].map(v => typeof v === 'number' ? v.toFixed(4) : v).join('|');
  if (_geo[k]) return _geo[k];
  r = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4);
  const g = new THREE.BoxGeometry(1, 1, 1, n, n, n);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const half = [w / 2, h / 2, d / 2], inner = [w / 2 - r, h / 2 - r, d / 2 - r];
  const c = [0, 0, 0], ic = [0, 0, 0];
  for (let i = 0; i < pos.count; i++) {
    const u = [pos.getX(i), pos.getY(i), pos.getZ(i)];
    for (let a = 0; a < 3; a++) {
      const s = Math.sign(u[a]), m = Math.abs(u[a]) * 2;
      c[a] = s * (m <= 0.5 ? (m / 0.5) * inner[a] : inner[a] + ((m - 0.5) / 0.5) * r);
      ic[a] = Math.max(-inner[a], Math.min(inner[a], c[a]));
    }
    let vx = c[0] - ic[0], vy = c[1] - ic[1], vz = c[2] - ic[2];
    const L = Math.hypot(vx, vy, vz) || 1; vx /= L; vy /= L; vz /= L;
    pos.setXYZ(i, ic[0] + vx * r, ic[1] + vy * r, ic[2] + vz * r);
    nor.setXYZ(i, vx, vy, vz);

function grp(parent, p = [0, 0, 0]) { const g = new THREE.Group(); g.position.set(p[0], p[1], p[2]); parent.add(g); return g; }
function mesh(geo, mat, parent, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(o.p[0], o.p[1], o.p[2]);
  if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]);
  if (o.s !== undefined) { if (typeof o.s === 'number') m.scale.setScalar(o.s); else m.scale.set(o.s[0], o.s[1], o.s[2]); }
  const layer = o.layer ?? LM;
  m.layers.set(layer);
  if (o.ink !== false && layer === LM) { const h = new THREE.Mesh(geo, inkMat); h.layers.set(LI); m.add(h); }
  parent.add(m); return m;
}
const _Y = new THREE.Vector3(0, 1, 0);
function tuft(parent, mat, R, base, dir, len, rad) {
  const d = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  const m = mesh(G.drop, mat, parent, { p: [(base[0] + d.x * len * .8) * R, (base[1] + d.y * len * .8) * R, (base[2] + d.z * len * .8) * R], s: [rad * R, len * R, rad * R] });

}
function blob(parent, mat, R, p, s, r) {
  return mesh(G.sphere, mat, parent, { p: [p[0] * R, p[1] * R, p[2] * R], s: typeof s === 'number' ? [s * R, s * R, s * R] : [s[0] * R, s[1] * R, s[2] * R], r });
}

function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }

const FW = 1024, FH = 512;
function faceToHead(x, y, R, off = 1) { const lon = (x / FW - 0.25) * TAU, lat = (0.5 - y / FH) * Math.PI; return [R * off * Math.sin(lon) * Math.cos(lat), R * 1.08 * off * Math.sin(lat), R * 1.02 * off * Math.cos(lon) * Math.cos(lat)]; }
function stroke(g, w, c = INK) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; }
function brow(g, pts, w, c = INK) { stroke(g, w, c); g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); if (pts.length === 3) g.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]); else g.lineTo(pts[1][0], pts[1][1]); g.stroke(); }
function drawEye(g, cx, cy, o) {
  const { rx, ry, iris = '#4a2e1a', lx = 0, ly = 0, lid = 0, low = 0, skin, lw = 5, liner = 0, wing = 0, side = 1 } = o;
  const pr = o.pr ?? rx * 0.52;
  const topY = cy - ry + 2 * ry * lid, botY = cy + ry - 2 * ry * low;
  g.save(); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.clip();
  g.fillStyle = '#fffaf0'; g.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  const px = cx + lx * rx * 0.5, py = cy + ly * ry * 0.5;
  g.fillStyle = iris; g.beginPath(); g.ellipse(px, py, pr, pr * 1.06, 0, 0, TAU); g.fill();
  g.fillStyle = INK; g.beginPath(); g.ellipse(px, py, pr * 0.55, pr * 0.6, 0, 0, TAU); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(px - pr * 0.35, py - pr * 0.42, pr * 0.27, pr * 0.27, 0, 0, TAU); g.fill();
  g.fillStyle = skin;
  if (lid > 0) g.fillRect(cx - rx - 1, cy - ry - 1, rx * 2 + 2, topY - (cy - ry) + 1);
  if (low > 0) g.fillRect(cx - rx - 1, botY, rx * 2 + 2, cy + ry - botY + 1);
  g.restore();
  g.save(); g.beginPath(); g.rect(cx - rx - lw, topY, rx * 2 + lw * 2, Math.max(1, botY - topY)); g.clip();
  stroke(g, lw * 0.6); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, TAU); g.stroke(); g.restore();
  stroke(g, lw + liner); g.beginPath();
  if (lid > 0.02) { const hw = rx * Math.sqrt(Math.max(0, 1 - Math.pow((topY - cy) / ry, 2))); g.moveTo(cx - hw - 3, topY + 1); g.quadraticCurveTo(cx, topY - 3, cx + hw + 3, topY + 1); }
  else g.ellipse(cx, cy, rx, ry, 0, Math.PI * 1.04, Math.PI * 1.96);
  g.stroke();
  if (wing) { g.beginPath(); g.moveTo(cx + side * rx * 0.92, topY + 2); g.lineTo(cx + side * (rx + wing), topY - wing * 0.55); g.stroke(); }
  if (low > 0.02) { const hw = rx * Math.sqrt(Math.max(0, 1 - Math.pow((botY - cy) / ry, 2))); stroke(g, lw * 0.55); g.beginPath(); g.moveTo(cx - hw, botY); g.quadraticCurveTo(cx, botY + 3, cx + hw, botY); g.stroke(); }
}
function closedEye(g, cx, cy, rx, ry, happy = false, lw = 6) { stroke(g, lw); g.beginPath(); if (happy) { g.moveTo(cx - rx, cy + ry * 0.25); g.quadraticCurveTo(cx, cy - ry * 0.9, cx + rx, cy + ry * 0.25); } else { g.moveTo(cx - rx, cy); g.quadraticCurveTo(cx, cy + ry * 0.55, cx + rx, cy); } g.stroke(); }
function mouthPath(g, x, y, w, h) { g.beginPath(); g.moveTo(x - w, y - 4); g.quadraticCurveTo(x, y - 1, x + w, y - 6); g.quadraticCurveTo(x + w * 0.2, y + h * 1.5, x - w, y - 4); g.closePath(); }
function mouthOpen(g, x, y, w, h, o = {}) {
  const { teeth = true, tongue = true, lip = INK, lw = 5 } = o;
  g.save(); mouthPath(g, x, y, w, h); g.fillStyle = '#4a0f1c'; g.fill(); g.clip();

}

function blush(g, x, y, c = 'rgba(255,95,120,.45)') { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, 24, 13, 0, 0, TAU); g.fill(); stroke(g, 2.5, 'rgba(200,40,70,.55)'); for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(x + i * 10 - 4, y + 6); g.lineTo(x + i * 10 + 4, y - 6); g.stroke(); } }
